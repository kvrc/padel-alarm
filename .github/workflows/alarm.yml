name: Padel-Alarm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padel-alarm
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skript ausführen
        env:
          NTFY_KANAL: ${{ secrets.NTFY_KANAL }}
        run: python alarm.py

      - name: Merkdatei speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gesehen.json
          git diff --cached --quiet || git commit -m "Merkdatei aktualisiert"
          git push
